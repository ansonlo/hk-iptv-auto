name: Update IPTV Source

on:
  schedule:
    # 北京時間 08:00 同 20:00 執行
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 👈 改咗呢度：刪除咗 inputs，唔使再揀

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.1
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5.1.0
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests opencc-python-reimplemented tqdm urllib3

    - name: Run scripts
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: |
        export TZ='Asia/Shanghai'
        
        # 👈 改咗：明確分開步驟執行，確保「先執藥、後測速」
        echo ">>> 🚀 1. 執藥 (搜尋新源) <<<"
        python discovery_sources.py
        
        echo ">>> 🌐 2. 通用 (執行 main.py) <<<"
        python main.py || echo "⚠️ main.py 跳過或出錯"
        
        echo ">>> 📡 3. 專線診斷 (生成廣州列表並封印死源) <<<"
        python gz_all_in_one.py

    - name: Commit and Push (Gentle Version)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 1. 先 Fetch 最新嘅遠端分支
        git fetch origin main
        
        # 2. Add 你啱啱產出嘅新數據
        git add auto_repair.log sources.txt *.m3u fail_tracker.json || true
        
        # 3. 嘗試 Commit
        if ! git diff --staged --quiet; then
          git commit -m "🚀 數據更新 & 五線診斷報告 ($(date +'%m-%d %H:%M'))"
          
          git merge origin/main -X ours --allow-unrelated-histories -m "🔄 自動合併遠端更改"
          
          git push origin main
        else
          echo "✅ 無變動，跳過提交"
        fi
