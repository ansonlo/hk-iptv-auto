name: Update IPTV Source

on:
  schedule:
    # 北京時間 08:00 同 20:00 執行
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 👈 改咗呢度：刪除咗 inputs，唔使再揀

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests opencc-python-reimplemented tqdm

    - name: Run scripts
      run: |
        export TZ='Asia/Shanghai'
        
        # 🤖 自動切換模式：
        if [ "${{ github.event_name }}" == "schedule" ]; then
          export SCAN_MODE="FULL_SCAN"
          echo ">>> 偵測到定時任務：啟動 FULL_SCAN 模式 <<<"
        else
          export SCAN_MODE="MANUAL_ONLY"
          echo ">>> 偵測到手動撳制：啟動 MANUAL_ONLY 模式 <<<"
        fi
        
    - name: 🚀 1. 執藥 (搜尋新源)
      run: python discovery_sources.py

    - name: 🌐 2. 通用 (生成香港列表)
      run: python main.py

    - name: 📡 3. 專線診斷 (生成廣州列表)
      run: python gz_all_in_one.py

    - name: Commit and Push (Gentle Version)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 1. 先 Fetch 最新嘅遠端分支
        git fetch origin main
        
        # 2. Add 你啱啱產出嘅新數據
        git add auto_repair.log sources.txt *.m3u || true
        
        # 3. 嘗試 Commit
        if ! git diff --staged --quiet; then
          git commit -m "🚀 數據更新 & 五線診斷報告 ($(date +'%m-%d %H:%M'))"
          
          # 🌟 溫柔核心：使用 merge 策略 "ours"
          # 意思係：如果同遠端有衝突，以我呢份 (剛剛測速完的新數據) 為準
          git merge origin/main -X ours --allow-unrelated-histories -m "🔄 自動合併遠端更改"
          
          # 4. 推送
          git push origin main
        else
          echo "✅ 無變動，跳過提交"
        fi
