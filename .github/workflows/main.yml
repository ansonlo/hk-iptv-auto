name: Update IPTV Source

on:
  schedule:
    # 北京時間 08:00 同 20:00 執行
    - cron: '0 */12 * * *'
  workflow_dispatch: # 方便手動隨時執行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests opencc-python-reimplemented tqdm

    - name: Run scripts
      run: |
        export TZ='Asia/Shanghai'
        
        # 1. 執藥 (呢個先係出「[源頭掃描]」報告嘅地方)
        echo "---------------------------------------"
        echo "Step 1: 執藥腳本 (Discovery)"
        python discovery_sources.py
        
        # 2. 測速 
        echo "---------------------------------------"
        echo "Step 2: 🌍 正在執行通用環境測試 (main.py)...""
        python main.py
                
        # 3. 執行專線診斷
        echo "🏥 正在執行廣州五路專線診斷 (gz_all_in_one.py)..."
        python gz_all_in_one.py

    - name: Commit and push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # 添加生成嘅檔案
        git add sources.txt auto_repair.log *.m3u || true
        
        # 只有喺有改動嘅時候先執行提交
        if ! git diff --staged --quiet; then
          git stash
          git pull origin main --rebase
          git stash pop || echo "No stash to pop"
          git add .
          git commit -m "🚀 自動更新: 核心 + 廣州五路診斷 ($(date +'%m-%d %H:%M'))"
          git push origin main
        else
          echo "✅ 數據冇變動，無需提交"
        fi
