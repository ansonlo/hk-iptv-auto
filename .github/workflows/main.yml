name: Update IPTV Source

on:
  schedule:
    # 北京時間 08:00 同 20:00 執行
    - cron: '0 */12 * * *'
  workflow_dispatch: # 方便手動隨時執行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 一次過裝晒 requests, opencc, tqdm
        pip install requests opencc-python-reimplemented tqdm

    - name: Run scripts
      run: |
        # 設定時區為北京時間
        export TZ='Asia/Shanghai'
        
        # 1. 啟動雙引擎搜尋 (GitHub + Gitee)
        # 呢步會自動幫你喺全網搵新源並寫入 sources.txt
        echo "📡 正在全網自動搜尋新發現的好源..."
        python discovery_sources.py
        
        # 2. 執行通用版測試
        # 更新 user_result.m3u
        echo "🌍 正在執行通用環境測試 (main.py)..."
        python main.py
        
        # 3. 執行廣州五路全網絡診斷
        # 產出專線 M3U 並生成終極診斷報告 (auto_repair.log)
        echo "🏥 正在執行廣州五路專線診斷 (gz_all_in_one.py)..."
        python gz_all_in_one.py

    - name: Commit and push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # 1. 將所有生成嘅檔案放入暫存區
        git add sources.txt auto_repair.log *.m3u || true
        
        # 2. 暫存改動並拉取遠端最新代碼，防止衝突
        git stash
        git pull origin main --rebase
        
        # 3. 恢復改動
        git stash pop || echo "No stash to pop"

        # 4. 再次確認添加所有檔案
        git add .
        
        # 5. 檢查係咪真係有嘢要 Commit
        if git diff --staged --quiet; then
          echo "✅ 數據冇變動，無需提交"
        else
          git commit -m "🚀 自動更新: 核心 + 廣州五路診斷 ($(date +'%m-%d %H:%M'))"
          git push origin main
        fi  # 👈 之前可能漏咗呢個 fi
