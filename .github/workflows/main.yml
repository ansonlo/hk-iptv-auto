name: Update IPTV Source

on:
  schedule:
    # 北京時間 08:00 同 20:00 執行
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 👈 改咗呢度：刪除咗 inputs，唔使再揀

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests opencc-python-reimplemented tqdm

    - name: Run scripts
      run: |
        export TZ='Asia/Shanghai'
        
        # 🤖 自動切換模式：
        if [ "${{ github.event_name }}" == "schedule" ]; then
          export SCAN_MODE="FULL_SCAN"
          echo ">>> 偵測到定時任務：啟動 FULL_SCAN 模式 <<<"
        else
          export SCAN_MODE="MANUAL_ONLY"
          echo ">>> 偵測到手動撳制：啟動 MANUAL_ONLY 模式 <<<"
        fi
        
        # 1. 執藥
        python discovery_sources.py
        
        # 2. 通用 
        python main.py
                
        # 3. 專線診斷
        python gz_all_in_one.py

    - name: Commit and Push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 1. Add 檔案
        git add auto_repair.log sources.txt *.m3u || true
        
        # 2. 檢查有無嘢要 commit
        if ! git diff --staged --quiet; then
          git commit -m "🚀 數據更新 & 五線診斷報告 ($(date +'%m-%d %H:%M'))"
          
          # 🌟 核心修復：喺 push 之前加呢一行
          git pull --rebase origin main
          
          # 3. 執行推送
          git push origin main
        else
          echo "✅ 無變動，跳過提交"
        fi
