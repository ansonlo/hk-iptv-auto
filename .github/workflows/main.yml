name: Update IPTV Source

on:
  schedule:
    # 北京時間 08:00 同 20:00 執行
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 👈 改咗呢度：刪除咗 inputs，唔使再揀

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests opencc-python-reimplemented tqdm

    - name: Run scripts
      run: |
        export TZ='Asia/Shanghai'
        
        # 🤖 自動切換模式：
        if [ "${{ github.event_name }}" == "schedule" ]; then
          export SCAN_MODE="FULL_SCAN"
          echo ">>> 偵測到定時任務：啟動 FULL_SCAN 模式 <<<"
        else
          export SCAN_MODE="MANUAL_ONLY"
          echo ">>> 偵測到手動撳制：啟動 MANUAL_ONLY 模式 <<<"
        fi
        
        # 1. 執藥
        python discovery_sources.py
        
        # 2. 通用 
        python main.py
                
        # 3. 專線診斷
        python gz_all_in_one.py

    - name: Commit and push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 🌟 關鍵優化 1：先將所有可能改動過嘅嘢都 add 入去
        # 確保 rebase 嗰陣 worktree 係乾淨嘅
        git add sources.txt sources_gz.txt auto_repair.log gz_repair.log *.m3u || true
        
        # 檢查有無嘢改過
        if ! git diff --staged --quiet; then
          MODE_NAME=${SCAN_MODE:-"UNKNOWN"}
          git commit -m "🚀 數據更新 [Mode: $MODE_NAME] ($(date +'%m-%d %H:%M'))"
          
          # 🌟 關鍵優化 2：先 fetch，如果有衝突就用 ours 策略或者直接 push
          git fetch origin main
          
          # 如果 rebase 仲係報錯，最簡單係先 pull 再 push，或者直接 push
          # 喺 Action 入面，通常用 rebase 係為咗保持 timeline 乾淨
          git rebase origin/main || git rebase --abort
          
          git push origin main
        else
          echo "✅ 數據與日誌均無變動，跳過提交"
        fi
