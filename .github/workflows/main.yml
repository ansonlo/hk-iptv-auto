name: Update IPTV Source

on:
  schedule:
    # 北京時間 08:00 同 20:00 執行
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 👈 改咗呢度：刪除咗 inputs，唔使再揀

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests opencc-python-reimplemented tqdm

    - name: Run scripts
      run: |
        export TZ='Asia/Shanghai'
        
        # 🤖 自動切換模式：
        if [ "${{ github.event_name }}" == "schedule" ]; then
          export SCAN_MODE="FULL_SCAN"
          echo ">>> 偵測到定時任務：啟動 FULL_SCAN 模式 <<<"
        else
          export SCAN_MODE="MANUAL_ONLY"
          echo ">>> 偵測到手動撳制：啟動 MANUAL_ONLY 模式 <<<"
        fi
        
        # 1. 執藥
        python discovery_sources.py
        
        # 2. 通用 
        python main.py
                
        # 3. 專線診斷
        #python gz_all_in_one.py

    - name: Commit and push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 1. 確保所有改動都放入暫存區
        git add sources.txt auto_repair.log *.m3u || true
        
        # 2. 檢查有無嘢改過
        if ! git diff --staged --quiet; then
          # 3. 本地先提交
          MODE_NAME=${SCAN_MODE:-"UNKNOWN"}
          git commit -m "🚀 數據更新 [Mode: $MODE_NAME] ($(date +'%m-%d %H:%M'))"
          
          # 4. 強制執行一次 fetch 同 rebase
          git fetch origin main
          git rebase origin/main
          
          # 5. 推送
          git push origin main
        else
          echo "✅ 數據與日誌均無變動，跳過提交"
        fi
