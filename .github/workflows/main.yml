name: Update IPTV Source

on:
  schedule:
    # 北京時間 08:00 同 20:00 執行（呢個係自動模式，行 FULL_SCAN）
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      scan_mode:
        description: '選擇執行模式'
        required: true
        default: 'MANUAL_ONLY'
        type: choice
        options:
          - MANUAL_ONLY
          - FULL_SCAN

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests opencc-python-reimplemented tqdm

    - name: Run scripts
      run: |
        export TZ='Asia/Shanghai'
        
        # 判斷係自動定手動觸發。如果是定時(schedule)，強制用 FULL_SCAN；手動則用你揀嘅 Mode
        if [ "${{ github.event_name }}" == "schedule" ]; then
          export SCAN_MODE="FULL_SCAN"
        else
          export SCAN_MODE="${{ github.event.inputs.scan_mode }}"
        fi
        
        echo "---------------------------------------"
        echo "Step 1: 執藥腳本 (Discovery) [Mode: $SCAN_MODE]"
        python discovery_sources.py
        
        # 2. 測速 
        #echo "---------------------------------------"
        #echo "Step 2: 🌍 正在執行通用環境測試 (main.py)...""
        #python main.py
                
        # 3. 執行專線診斷
        #echo "---------------------------------------"
        #echo "🏥 正在執行廣州五路專線診斷 (gz_all_in_one.py)..."
        #python gz_all_in_one.py

    - name: Commit and push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 確保 log 和 m3u 檔案有被追蹤
        git add sources.txt auto_repair.log *.m3u || true
        
        # 檢查是否有任何變動（包括 log 檔案的更新）
        if ! git diff --staged --quiet; then
          # 使用 --rebase 避免產生額外的 merge commit
          git pull origin main --rebase
          git commit -m "🚀 數據更新 [Mode: $SCAN_MODE] ($(date +'%m-%d %H:%M'))"
          git push origin main
        else
          echo "✅ 數據與日誌均無變動，跳過提交"
        fi
