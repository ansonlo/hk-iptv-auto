name: Update IPTV Source

on:
  schedule:
    # 北京時間 08:00 同 20:00 執行
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 👈 改咗呢度：刪除咗 inputs，唔使再揀

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests opencc-python-reimplemented tqdm

    - name: Run scripts
      run: |
        export TZ='Asia/Shanghai'
        
        # 🤖 自動切換模式：
        if [ "${{ github.event_name }}" == "schedule" ]; then
          export SCAN_MODE="FULL_SCAN"
          echo ">>> 偵測到定時任務：啟動 FULL_SCAN 模式 <<<"
        else
          export SCAN_MODE="MANUAL_ONLY"
          echo ">>> 偵測到手動撳制：啟動 MANUAL_ONLY 模式 <<<"
        fi
        
        # 1. 執藥
        python discovery_sources.py
        
        # 2. 測速 (如果你想手動行都測速，就開返佢)
        python main.py
                
        # 3. 專線診斷
        python gz_all_in_one.py

    - name: Commit and push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 先 Add，再 Pull，最後 Push，解決 128 衝突問題
        git add sources.txt auto_repair.log *.m3u || true
        
        if ! git diff --staged --quiet; then
          git pull origin main --rebase
          git commit -m "🚀 數據更新 [${{ github.event_name }}] ($(date +'%m-%d %H:%M'))"
          git push origin main
        else
          echo "✅ 冇數據變動，跳過提交"
        fi
