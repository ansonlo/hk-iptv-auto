name: Update IPTV Source

on:
  schedule:
    # 北京時間 08:00 同 20:00 執行
    - cron: '0 */12 * * *'
  workflow_dispatch: # 方便手動隨時執行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests opencc-python-reimplemented tqdm

    - name: Run scripts
      run: |
        export TZ='Asia/Shanghai'
        
        # 1. 搵新源 (每 7 日執行一次，設定喺星期一)
        # $(date +%u) 1為星期一，7為星期日
        if [ "$(date +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "📅 今日係執行日（或手動執行），啟動全網自動搜尋新發現的好源..."
          python discovery_sources.py
        else
          echo "⏭️ 今日非搜尋日，跳過 discovery_sources.py，直接進入連通性測試。"
        fi
        
        # 2. 通用測試
        echo "🌍 正在執行通用環境測試 (main.py)..."
        python main.py
        
        # 3. 專線診斷
        echo "🏥 正在執行廣州五路專線診斷 (gz_all_in_one.py)..."
        python gz_all_in_one.py

    - name: Commit and push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # 添加生成嘅檔案
        git add sources.txt auto_repair.log *.m3u || true
        
        # 只有喺有改動嘅時候先執行提交
        if ! git diff --staged --quiet; then
          git stash
          git pull origin main --rebase
          git stash pop || echo "No stash to pop"
          git add .
          git commit -m "🚀 自動更新: 核心 + 廣州五路診斷 ($(date +'%m-%d %H:%M'))"
          git push origin main
        else
          echo "✅ 數據冇變動，無需提交"
        fi
